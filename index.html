<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Trading Collection
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="site-title"
            >
                My Trading Collection
            </a>


            <nav class="navigation">

                <a
                    href="index.html"
                    class="active"
                >
                    Home
                </a>

                <a
                    href="collection.html"
                >
                    Collection
                </a>

                <a
                    href="wants.html"
                >
                    Wants
                </a>

                <a
                    href="contact.html"
                >
                    Contact
                </a>

            </nav>

        </div>

    </header>



    <!-- HOME -->

    <main>

        <section class="hero">

            <div class="hero-inner">

                <p class="eyebrow">
                    TRADING COLLECTION
                </p>


                <h1>
                    My Collection
                </h1>


                <p class="hero-description">
                    My collection of audio and
                    video recordings.
                </p>

            </div>

        </section>

<!-- HOME COLLECTION STATISTICS -->

<section class="home-stats">

    <div class="home-stats-inner">

        <div class="home-stat">
            <div
                class="home-stat-number"
                id="home-total-recordings"
            >
                —
            </div>

            <div class="home-stat-label">
                Recordings
            </div>
        </div>


        <div class="home-stat">
            <div
                class="home-stat-number"
                id="home-audio-recordings"
            >
                —
            </div>

            <div class="home-stat-label">
                Audio
            </div>
        </div>


        <div class="home-stat">
            <div
                class="home-stat-number"
                id="home-video-recordings"
            >
                —
            </div>

            <div class="home-stat-label">
                Video
            </div>
        </div>

    </div>


    <div class="home-stats-secondary">

        <div class="home-shows">
            <span
                id="home-total-shows"
            >
                —
            </span>

            Shows
        </div>


        <div class="home-updated">

            Collection last updated

            <span
                id="home-last-updated"
            >
                —
            </span>

        </div>

    </div>

</section>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <p>
            My Trading Collection
        </p>


        <p>
            Collection data powered by Encora
        </p>

    </footer>


</body>

</html>
<script src="home-stats.js"></script>
