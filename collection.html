<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Collection — My Trading Collection
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="index.html"
                class="site-title"
            >
                My Trading Collection
            </a>


            <nav class="navigation">

                <a
                    href="index.html"
                >
                    Home
                </a>

                <a
                    href="collection.html"
                    class="active"
                >
                    Collection
                </a>

                <a
                    href="wants.html"
                >
                    Wants
                </a>

                <a
                    href="contact.html"
                >
                    Contact
                </a>

            </nav>

        </div>

    </header>



    <!-- COLLECTION -->

    <main>

        <section class="collection-page">

            <div class="section-inner">


                <div class="section-heading">

                    <p class="eyebrow">
                        RECORDINGS
                    </p>


                    <h1>
                        Collection
                    </h1>


                    <p>
                        Browse the collection by show,
                        search, or media type.
                    </p>

                </div>



                <!-- SEARCH -->

                <div class="collection-controls">

                    <label
                        for="search"
                        class="sr-only"
                    >
                        Search recordings
                    </label>


                    <input
                        type="search"
                        id="search"
                        placeholder="Search recordings..."
                        autocomplete="off"
                    >


                    <!-- FILTERS -->

                    <div class="filters">

                        <button
                            type="button"
                            class="filter-button active"
                            data-filter="all"
                        >
                            All
                        </button>


                        <button
                            type="button"
                            class="filter-button"
                            data-filter="audio"
                        >
                            Audio
                        </button>


                        <button
                            type="button"
                            class="filter-button"
                            data-filter="video"
                        >
                            Video
                        </button>

                    </div>


                    <!-- STATISTICS -->

                    <div
                        id="collection-stats"
                        class="collection-stats"
                    >
                        Loading collection...
                    </div>


                    <!-- A-Z -->

                    <nav
                        id="alphabet-nav"
                        class="alphabet-nav"
                        aria-label="Browse collection alphabetically"
                    >
                    </nav>

                </div>



                <!-- RECORDINGS -->

                <div
                    id="collection"
                    class="recordings"
                >

                    <p class="loading">
                        Loading collection...
                    </p>

                </div>


            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <p>
            My Trading Collection
        </p>


        <p>
            Collection data powered by Encora
        </p>

    </footer>



    <script src="script.js"></script>


</body>

</html>
