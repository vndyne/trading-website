name: Update Encora Collection

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-encora:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch Encora collection
        env:
          ENCORA_API_KEY: ${{ secrets.ENCORA_API_KEY }}
        run: npm run fetch-encora

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/collection.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated collection
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/collection.json

          git commit -m "Update Encora collection"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No collection changes detected."